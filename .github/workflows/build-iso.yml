name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-iso.yml'
      - '.github/repository-metadata.json'
      - 'VERSION'
      - 'package.json'
      - 'Makefile'
      - 'config/**'
      - 'packages/**'
      - 'services/**'
      - 'image/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/build-iso.yml'
      - '.github/repository-metadata.json'
      - 'VERSION'
      - 'package.json'
      - 'Makefile'
      - 'config/**'
      - 'packages/**'
      - 'services/**'
      - 'image/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_BUILD_IMAGE: debian:13-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with Debian 13 live-build
        run: |
          docker pull "$DEBIAN_BUILD_IMAGE"
          docker run --privileged --rm \
            --env CI=true \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$DEBIAN_BUILD_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --yes --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common syslinux-utils \
                mtools dosfstools \
                ca-certificates curl jq git make openssl xz-utils shellcheck nftables
              git config --global --add safe.directory /work

              source image/config/includes.chroot/usr/share/openclaw-os/release.env
              node_archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
              curl --proto "=https" --tlsv1.2 --fail --location --silent --show-error \
                "https://nodejs.org/dist/v${NODE_VERSION}/${node_archive}" \
                --output "/tmp/${node_archive}"
              printf "%s  %s\n" "$NODE_SHA256_AMD64" "/tmp/${node_archive}" \
                | sha256sum --check --status
              tar -xJf "/tmp/${node_archive}" -C /opt
              export PATH="/opt/node-v${NODE_VERSION}-linux-x64/bin:$PATH"
              test "$(node --version)" = "v${NODE_VERSION}"

              make validate
              make test
              make verify-artifacts
              ./scripts/build-image.sh amd64
            '

      - name: Install UEFI smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ovmf qemu-system-x86 squashfs-tools xorriso

      - name: Verify boot configuration
        id: boot_config
        run: |
          set -euo pipefail
          iso_path="dist/openclaw-os-$(cat VERSION)-amd64.iso"
          extract_dir="$(mktemp -d)"
          diagnostics_dir="$RUNNER_TEMP/openclaw-os-uefi-smoke"
          trap 'rm -rf "$extract_dir"' EXIT
          mkdir -p "$diagnostics_dir"

          xorriso -osirrox on \
            -indev "$iso_path" \
            -extract /live/filesystem.squashfs "$extract_dir/filesystem.squashfs"
          xorriso -osirrox on \
            -indev "$iso_path" \
            -extract /boot/grub/grub.cfg "$diagnostics_dir/grub.cfg"
          xorriso -indev "$iso_path" -find /boot/grub -print \
            >"$diagnostics_dir/iso-grub-listing.txt"
          unsquashfs -cat \
            "$extract_dir/filesystem.squashfs" \
            etc/systemd/system/openclaw-boot-marker.service \
            >"$diagnostics_dir/openclaw-boot-marker.service"
          unsquashfs -ll "$extract_dir/filesystem.squashfs" \
            >"$diagnostics_dir/squashfs-listing.txt"

          grep -Fq 'OPENCLAW_OS_BOOT_OK' \
            "$diagnostics_dir/openclaw-boot-marker.service"
          grep -Fq '/dev/ttyS0' \
            "$diagnostics_dir/openclaw-boot-marker.service"
          grep -Fq \
            'etc/systemd/system/multi-user.target.wants/openclaw-boot-marker.service' \
            "$diagnostics_dir/squashfs-listing.txt"
          grep -Eq '^set timeout=5$' "$diagnostics_dir/grub.cfg"
          grep -Fq 'terminal_output console serial' "$diagnostics_dir/grub.cfg"
          grep -Eq '^menuentry "Live system' "$diagnostics_dir/grub.cfg"
          grep -Eq '^[[:space:]]*linux[[:space:]]+/live/vmlinuz-' \
            "$diagnostics_dir/grub.cfg"
          grep -Fq 'console=ttyS0,115200n8' "$diagnostics_dir/grub.cfg"
          if grep -Fq '@LINUX_LIVE@' "$diagnostics_dir/grub.cfg"; then
            echo 'live-build left the GRUB live-entry marker unexpanded' >&2
            exit 1
          fi
          if grep -Fq 'source /boot/grub/live.cfg' "$diagnostics_dir/grub.cfg"; then
            echo 'GRUB configuration references a nonexistent live.cfg' >&2
            exit 1
          fi

      - name: UEFI live-boot smoke test
        id: uefi_smoke
        env:
          SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/openclaw-os-uefi-smoke
        run: |
          mkdir -p "$SMOKE_DIAGNOSTICS_DIR"
          ./scripts/smoke-iso.sh "dist/openclaw-os-$(cat VERSION)-amd64.iso"

      - name: Upload UEFI smoke-test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-os-uefi-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/openclaw-os-uefi-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unverified ISO debug artifact
        if: ${{ always() && (steps.boot_config.outcome == 'failure' || steps.uefi_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-os-unverified-${{ github.sha }}
          path: dist/openclaw-os-*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Upload ISO, SBOM, and metadata
        if: ${{ steps.boot_config.outcome == 'success' && steps.uefi_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-os-amd64
          path: |
            dist/openclaw-os-*.iso
            dist/openclaw-os-*.iso.sha256
            dist/openclaw-os-*.sbom.spdx.json
            dist/openclaw-os-*.sbom.spdx.json.sha256
            dist/openclaw-os-*.build.json
            dist/build-*.log
          if-no-files-found: error
          retention-days: 14
