# OpenClaw OS live-media boot menu.
#
# live-build expands the placeholder below into concrete kernel and initrd
# menu entries. Keep that placeholder in this template instead of sourcing
# a file that live-build does not create.

set default=0
set timeout_style=menu
set timeout=5

# Keep the firmware console for local users and mirror GRUB output to COM1 for
# headless systems and deterministic CI diagnostics. Serial initialization is
# best effort so local boot remains available on systems without a usable COM1.
if insmod serial; then
  if serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1; then
    terminal_output console serial
  fi
fi

@LINUX_LIVE@

if [ "${grub_platform}" = "efi" ]; then
  source /boot/grub/install_start.cfg
fi
