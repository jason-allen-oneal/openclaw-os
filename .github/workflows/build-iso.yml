name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'VERSION'
      - 'package.json'
      - 'Makefile'
      - 'config/**'
      - 'packages/**'
      - 'services/**'
      - 'image/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_BUILD_IMAGE: debian:13-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2

jobs:
  changes:
    name: detect-iso-impact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.filter.outputs.build_required }}
    steps:
      - name: Check out pull request history
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine whether the ISO is affected
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "build_required=true" >>"$GITHUB_OUTPUT"
            echo "Non-pull-request event: a complete ISO build is required."
            exit 0
          fi

          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "build_required=true" >>"$GITHUB_OUTPUT"
            echo "Pull request commit identity was unavailable; failing safe to a complete ISO build."
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "build_required=true" >>"$GITHUB_OUTPUT"
            echo "Pull request history was incomplete; failing safe to a complete ISO build."
            exit 0
          fi

          changed_files="$RUNNER_TEMP/openclaw-os-changed-files"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" >"$changed_files"

          echo "Changed files:"
          if [[ -s "$changed_files" ]]; then
            tr '\0' '\n' <"$changed_files"
          else
            echo "  (none detected)"
          fi

          trusted_filter="$RUNNER_TEMP/iso-build-required.sh"
          if ! git show "$BASE_SHA:scripts/iso-build-required.sh" >"$trusted_filter"; then
            echo "build_required=true" >>"$GITHUB_OUTPUT"
            echo "The base branch has no trusted ISO change filter; a complete ISO build is required."
            exit 0
          fi

          build_required="$(bash "$trusted_filter" <"$changed_files")"
          case "$build_required" in
            true|false)
              ;;
            *)
              echo "Invalid ISO change-filter result: $build_required" >&2
              exit 1
              ;;
          esac

          echo "build_required=$build_required" >>"$GITHUB_OUTPUT"
          echo "ISO build required: $build_required"

  build-amd64:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Require successful change detection
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "ISO change detection failed; refusing to satisfy the required check." >&2
          exit 1

      - name: Require a valid change decision
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.build_required != 'true' && needs.changes.outputs.build_required != 'false' }}
        run: |
          echo "ISO change detection returned no valid decision; refusing to satisfy the required check." >&2
          exit 1

      - name: Satisfy the check for non-image changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.build_required == 'false' }}
        run: |
          echo "No ISO-impacting files changed."
          echo "The required build-amd64 check is satisfied without constructing an image."

      - name: Check out repository
        if: ${{ needs.changes.outputs.build_required == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with Debian 13 live-build
        if: ${{ needs.changes.outputs.build_required == 'true' }}
        run: |
          docker pull "$DEBIAN_BUILD_IMAGE"
          docker run --privileged --rm \
            --env CI=true \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$DEBIAN_BUILD_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --yes --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common syslinux-utils \
                mtools dosfstools \
                ca-certificates curl jq git make openssl python3 xz-utils shellcheck nftables
              git config --global --add safe.directory /work

              source image/config/includes.chroot/usr/share/openclaw-os/release.env
              node_archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
              curl --proto "=https" --tlsv1.2 --fail --location --silent --show-error \
                "https://nodejs.org/dist/v${NODE_VERSION}/${node_archive}" \
                --output "/tmp/${node_archive}"
              printf "%s  %s\n" "$NODE_SHA256_AMD64" "/tmp/${node_archive}" \
                | sha256sum --check --status
              tar -xJf "/tmp/${node_archive}" -C /opt
              export PATH="/opt/node-v${NODE_VERSION}-linux-x64/bin:$PATH"
              test "$(node --version)" = "v${NODE_VERSION}"

              grub_template="image/config/bootloaders/grub-pc/grub.cfg"
              grub_marker_count="$(grep -oF "@LINUX_LIVE@" "$grub_template" | wc -l || true)"
              if [[ "$grub_marker_count" -ne 1 ]]; then
                printf "Expected exactly one @LINUX_LIVE@ marker in %s, found %s.\n" \
                  "$grub_template" "$grub_marker_count" >&2
                exit 1
              fi

              make validate
              make test
              make verify-artifacts
              ./scripts/build-image.sh amd64
            '

      - name: Install UEFI smoke-test tools
        if: ${{ needs.changes.outputs.build_required == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ovmf qemu-system-x86 squashfs-tools xorriso

      - name: Verify boot configuration
        if: ${{ needs.changes.outputs.build_required == 'true' }}
        id: boot_config
        run: |
          set -euo pipefail
          iso_path="dist/openclaw-os-$(cat VERSION)-amd64.iso"
          extract_dir="$(mktemp -d)"
          diagnostics_dir="$RUNNER_TEMP/openclaw-os-uefi-smoke"
          trap 'rm -rf "$extract_dir"' EXIT
          mkdir -p "$diagnostics_dir"

          xorriso -osirrox on \
            -indev "$iso_path" \
            -extract /live/filesystem.squashfs "$extract_dir/filesystem.squashfs"
          xorriso -osirrox on \
            -indev "$iso_path" \
            -extract /boot/grub/grub.cfg "$diagnostics_dir/grub.cfg"
          xorriso -indev "$iso_path" -find /boot/grub -exec lsdl -- \
            >"$diagnostics_dir/iso-grub-listing.txt"
          unsquashfs -cat \
            "$extract_dir/filesystem.squashfs" \
            etc/systemd/system/openclaw-boot-marker.service \
            >"$diagnostics_dir/openclaw-boot-marker.service"
          unsquashfs -ll "$extract_dir/filesystem.squashfs" \
            >"$diagnostics_dir/squashfs-listing.txt"

          grep -Fq 'OPENCLAW_OS_BOOT_OK' \
            "$diagnostics_dir/openclaw-boot-marker.service"
          grep -Fq '/dev/ttyS0' \
            "$diagnostics_dir/openclaw-boot-marker.service"
          grep -Fq \
            'etc/systemd/system/multi-user.target.wants/openclaw-boot-marker.service' \
            "$diagnostics_dir/squashfs-listing.txt"
          grep -Eq '^set timeout=5$' "$diagnostics_dir/grub.cfg"
          grep -Fq 'terminal_output console serial' "$diagnostics_dir/grub.cfg"
          grep -Eq '^menuentry "Live system' "$diagnostics_dir/grub.cfg"
          primary_live_entry_count="$(
            grep -Fxc 'menuentry "Live system (amd64)" --hotkey=l {' \
              "$diagnostics_dir/grub.cfg" || true
          )"
          if [[ "$primary_live_entry_count" -ne 1 ]]; then
            printf 'Expected exactly one primary amd64 live menu entry, found %s.\n' \
              "$primary_live_entry_count" >&2
            exit 1
          fi
          grep -Eq '^[[:space:]]*linux[[:space:]]+/live/vmlinuz-' \
            "$diagnostics_dir/grub.cfg"
          grep -Fq 'console=ttyS0,115200n8' "$diagnostics_dir/grub.cfg"
          if grep -Fq '@LINUX_LIVE@' "$diagnostics_dir/grub.cfg"; then
            echo 'live-build left the GRUB live-entry marker unexpanded' >&2
            exit 1
          fi
          if grep -Fq 'source /boot/grub/live.cfg' "$diagnostics_dir/grub.cfg"; then
            echo 'GRUB configuration references a nonexistent live.cfg' >&2
            exit 1
          fi

      - name: UEFI live-boot smoke test
        if: ${{ needs.changes.outputs.build_required == 'true' }}
        id: uefi_smoke
        env:
          SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/openclaw-os-uefi-smoke
        run: |
          mkdir -p "$SMOKE_DIAGNOSTICS_DIR"
          ./scripts/smoke-iso.sh "dist/openclaw-os-$(cat VERSION)-amd64.iso"

      - name: Upload UEFI smoke-test diagnostics
        if: ${{ always() && needs.changes.outputs.build_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-os-uefi-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/openclaw-os-uefi-smoke/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload unverified ISO debug artifact
        if: ${{ always() && needs.changes.outputs.build_required == 'true' && (steps.boot_config.outcome == 'failure' || steps.uefi_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-os-unverified-${{ github.sha }}
          path: dist/openclaw-os-*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Upload ISO, SBOM, and metadata
        if: ${{ needs.changes.outputs.build_required == 'true' && steps.boot_config.outcome == 'success' && steps.uefi_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-os-amd64
          path: |
            dist/openclaw-os-*.iso
            dist/openclaw-os-*.iso.sha256
            dist/openclaw-os-*.sbom.spdx.json
            dist/openclaw-os-*.sbom.spdx.json.sha256
            dist/openclaw-os-*.build.json
            dist/build-*.log
          if-no-files-found: error
          retention-days: 30
