# OpenClaw OS live-media boot menu.
#
# live-build's stock menu waits indefinitely for input. OpenClaw OS is an
# appliance image, so the default live entry must boot unattended while still
# leaving a short window for an operator to select the installer or recovery
# entries.

set default=0
set timeout_style=menu
set timeout=5

# Keep the firmware console for local users and mirror GRUB to COM1 for
# headless systems and deterministic CI diagnostics. Failure to initialize the
# serial module must not prevent a normal local boot.
if insmod serial; then
  if serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1; then
    terminal_input console serial
    terminal_output console serial
  fi
fi

source /boot/grub/live.cfg

if [ "${grub_platform}" = "efi" ]; then
  source /boot/grub/install_start.cfg
fi
